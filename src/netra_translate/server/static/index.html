<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netra Translate</title>
  <meta name="description" content="Translate Khmer and English scans, photos and PDFs on your own machine. Export the translation to Word.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/KantumruyPro-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/" aria-label="Netra Translate, documents" data-logo>
        <span class="logo" aria-hidden="true"><span class="logo-symbol"></span><span class="logo-word" data-logo-word></span></span>
        <span class="brand-word">Translate</span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="#/" data-nav="home" data-i18n="nav.documents"></a>
        <a href="#/api" data-nav="api" data-i18n="nav.api"></a>
      </nav>
      <span id="engine-status" class="status status-running engine-status" role="status" data-i18n="engine.loading"></span>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <div class="foot-inner meta">
      <p><span id="footer-version">Netra Translate</span> · <span id="footer-note" data-i18n="footer.local"></span></p>
      <p class="foot-links">
        <a href="/docs" target="_blank" rel="noopener" data-i18n="footer.apidocs"></a>
        <a href="https://github.com/netra-ai-lab/netra-translate" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/netra-ai-lab/netra-translate#licensing" target="_blank" rel="noopener" data-i18n="footer.licences"></a>
        <a href="https://github.com/netra-ai-lab/netra-translate/issues" target="_blank" rel="noopener" data-i18n="footer.issues"></a>
      </p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
